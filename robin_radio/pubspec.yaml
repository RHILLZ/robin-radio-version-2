name: robin_radio
description: "Robin Radio - Personal Music Player"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Audio playback
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.17

  # Firebase
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0

  # Image caching
  cached_network_image: ^3.4.0

  # Fuzzy search
  fuzzywuzzy: ^1.2.0

  # State management
  flutter_riverpod: ^2.5.0

  # Connectivity detection
  connectivity_plus: ^6.0.0

  # HTTP client for cache downloads
  http: ^1.2.0

  # Local path access for caching
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0
  path_provider_platform_interface: ^2.1.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/branding/
