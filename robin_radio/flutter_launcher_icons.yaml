flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/logo_icon.png"

  # Android Adaptive Icons
  adaptive_icon_background: "#1a1a2e"
  adaptive_icon_foreground: "assets/branding/logo_icon_foreground.png"

  # iOS requires no transparency
  remove_alpha_ios: true

  # PWA support
  web:
    generate: true
    image_path: "assets/branding/logo_icon.png"
    background_color: "#1a1a2e"
    theme_color: "#7c3aed"
